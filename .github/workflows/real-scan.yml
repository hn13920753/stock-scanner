name: 真實資料掃描測試

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["*.py", "tools/**", "requirements.txt", ".github/workflows/real-scan.yml"]

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/real_scan.py "AI 產業"
