name: 高勝率研究

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research_winrate.py", ".github/workflows/research-winrate.yml"]

permissions:
  contents: write

concurrency:
  group: records
  cancel-in-progress: false

jobs:
  winrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: 成功率 70～80% 研究
        run: |
          mkdir -p research
          set -o pipefail
          python tools/research_winrate.py 2>&1 | tee research/winrate_log.txt
        continue-on-error: true
      - name: 保存結果
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add research/
          git commit -m "高勝率研究結果 [skip ci]" || exit 0
          git pull --rebase && git push
