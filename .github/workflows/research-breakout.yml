name: 起漲點研究

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research_breakout.py", "tools/research_dip.py", ".github/workflows/research-breakout.yml"]

permissions:
  contents: write

concurrency:
  group: records
  cancel-in-progress: false

jobs:
  breakout:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt scikit-learn
      - name: 起漲點方法＋機器學習
        run: |
          mkdir -p research
          set -o pipefail
          python tools/research_breakout.py 2>&1 | tee research/breakout_log.txt
        continue-on-error: true
      - name: 強勢股大跌買進研究
        run: |
          set -o pipefail
          python tools/research_dip.py 2>&1 | tee research/dip_log.txt
        continue-on-error: true
      - name: 保存結果
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add research/
          git commit -m "起漲點研究結果 [skip ci]" || exit 0
          for k in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
