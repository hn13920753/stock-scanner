name: 單股逐筆

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["tools/research_combo.py"]

permissions:
  contents: write

concurrency:
  group: records
  cancel-in-progress: false

jobs:
  dump:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: mkdir -p research && python tools/research_combo.py
      - name: 保存
        if: always()
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add research/
          git commit -m "單股逐筆結果 [skip ci]" || exit 0
          for k in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
