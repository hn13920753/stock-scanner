name: 每日進場紀錄與驗證

on:
  schedule:
    - cron: "15 7 * * 1-5"   # 台灣時間週一～五 15:15（收盤後）
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: records
  cancel-in-progress: false

jobs:
  record:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python tools/daily_record.py 2>&1 | tee records/last_run.txt
      - name: 保存紀錄
        run: |
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git add records/
          git commit -m "每日進場紀錄 $(TZ=Asia/Taipei date +%F) [skip ci]" || exit 0
          git pull --rebase && git push
